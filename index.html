<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone - Watch TV Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="logo">NETFLIX</a>
        <a href="login.html" class="btn btn-primary">Sign In</a>
    </div>

    <div class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Unlimited movies, TV shows, and more.</h1>
            <p class="hero-subtitle">Watch anywhere. Cancel anytime.</p>
            <p class="hero-subtitle" style="font-size: 1.2rem; margin-top: 1rem;">Ready to watch? Enter your email to create or restart your membership.</p>
            
            <form class="email-form" action="login.html">
                <input type="email" class="email-input" placeholder="Email address" required>
                <button type="submit" class="btn btn-primary btn-large">Get Started ></button>
            </form>
        </div>
    </div>
</body>
</html>
