<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="navbar">
        <a href="index.html" class="logo">NETFLIX</a>
    </div>

    <div class="login-card">
        <h1 class="login-title">Sign In</h1>
        <form action="browse.html">
            <div class="form-group">
                <input type="email" class="form-control" placeholder="Email or phone number" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="Password" value="password" required>
            </div>
            <button type="submit" class="btn btn-primary login-btn">Sign In</button>

            <div class="login-help">
                <div>
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#">Need help?</a>
            </div>
        </form>

        <div style="margin-top: 50px; color: #737373;">
            New to Netflix? <a href="index.html" style="color: white; hover: underline;">Sign up now</a>.
        </div>
    </div>
</body>

</html>
