<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <link rel="stylesheet" href="signin.css">
</head>

<body>
    <div class="signin-container">
        <a href="index.html" class="signin-logo">
            <img src="./assets/amazon_logo_dark.png" width="100px" alt="Amazon Logo">
        </a>
        <div class="signin-box">
            <h1>Sign in</h1>
            <label for="email">Email or mobile phone number</label>
            <input type="text" id="email">
            <button class="signin-btn">Continue</button>
            <p>By continuing, you agree to Amazon's <a href="#" class="help-link">Conditions of Use</a> and <a href="#"
                    class="help-link">Privacy Notice</a>.</p>
            <div class="help-section">
                <a href="#" class="help-link"><i class="fas fa-caret-right"></i> Need help?</a>
            </div>
        </div>
        <div class="new-account-section">
            <p>New to Amazon?</p>
            <a href="signup.html" class="create-account-btn">Create your Amazon account</a>
        </div>
        <div class="signin-footer">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
            <p>&copy; 1996-2024, Amazon.com, Inc. or its affiliates</p>
        </div>
    </div>
</body>

</html>
